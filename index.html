<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock-paper-scissor</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="character-area">
        <img src="img/poo.svg" width="100" alt="poo">
        <img src="img/bot.svg" width="100" alt="bot">
    </div>

    <div id="result">
        <img id="music-btn" class="corner-icon" src="img/music.png" width="50" alt="music">
        <p id="round-result">PLAY YOUR MOVE TO START THE GAME!</p>
        <p>You: <span id="player-score">0</span> Bot: <span id="computer-score">0</span></p>
        <h2 id="winner"></h2>
        <button id="reset-btn">Play Again</button>
    </div>

    <div id="controls">
        <button id="rock">Rock</button>
        <button id="paper">Paper</button>
        <button id="scissor">Scissor</button>
    </div>

    <audio id="click" src="sounds/button.mp3"></audio>
    <audio id="music" src="sounds/music.mp3" loop></audio>
    <audio id="game-over" src="sounds/game-over.mp3"></audio>
    <audio id="victory" src="sounds/victory.mp3"></audio>
</body>
</html>
